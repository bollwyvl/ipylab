name: ipylab-lite
channels:
  - conda-forge
  - nodefaults
dependencies:
  # runtimes
  - python 3.12.*
  - nodejs 24.*
  # run
  - ipywidgets >=8.0,<9
  # build
  - mamba
  - pip
  - python-build
  # docs
  - pydata-sphinx-theme
  - myst-parser
  # demo
  - notebook >=7.5.0,<8
  - jupyterlite-core >=0.7.0,<0.8
  - jupyterlite-core-with-libarchive
  - jupyterlite-core-with-lab
  - jupyterlite-pyodide-kernel >=0.7.0,<0.8
  - jupyterlite-sphinx >=0.22.0,<0.23.0
